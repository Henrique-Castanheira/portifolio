<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu site</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: row;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* ==================== BARRA LATERAL ==================== */
        .barraLateral {
            background-color: #1e3a8a; /* azul escuro bonito */
            width: 80px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: width 0.4s ease;
            overflow: hidden;
            padding-top: 20px;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
        }

        .barraLateral.aberto {
            width: 260px;
        }

        /* Botão do menu */
        .btnMenu {
            background: none;
            border: none;
            color: white;
            padding: 12px;
            margin-bottom: 20px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .btnMenu:hover {
            background-color: rgba(255,255,255,0.1);
        }

        /* Itens do menu */
        .menuItem {
            width: 100%;
            padding: 12px 20px;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
        }

        .menuItem:hover {
            background-color: rgba(255,255,255,0.15);
        }

        .menuItem svg {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .menuItem .label {
            opacity: 0;
            white-space: nowrap;
            transition: opacity 0.3s;
        }

        .barraLateral.aberto .menuItem .label {
            opacity: 1;
        }

        /* ==================== CONTEÚDO ==================== */
        main {
            margin-left: 80px;
            padding: 30px;
            flex: 1;
            transition: margin-left 0.4s ease;
        }

        .barraLateral.aberto + main {
            margin-left: 260px;
        }

        .caixa {
            height: 500px;
            width: 100%;
            max-width: 1000px;
            background-color: #4b5563;
            border-radius: 10px;
            display: flex;
            justify-content: top;
            flex-direction: column;
            align-items: center;
            color: white;
            margin: 20px auto;
            padding: 20px 40px;
        }

        .caixaColorida {
            width: 100px;
            height: 100px;
            background-color: red;
            animation: myAnimation 20s infinite;
            margin: 30px auto;
            border-radius: 10px;
        }

        @keyframes myAnimation {
            0% { background-color: red; }
            25% { background-color: yellow; }
            50% { background-color: blue; }
            100% { background-color: green; }
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #1f2937;
            color: #fff;
            text-align: center;
            padding: 15px 0;
            z-index: 10;
        }
        button {
            background-color: white;
            font-size: 16px;
            border-radius: 12px;
            transition-duration: 0.4s;

            border: none;
            color: black;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: grey;
            /* Green */
            color: white;
            box-shadow: 0 8px 16px 0 rgba(0, 0, 0, 0.6)
        }
    </style>
</head>

<body>

    
<!-- BARRA LATERAL -->
<div class="barraLateral" id="barraLateral">
        
    <button class="btnMenu" id="btnMenu">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6h16M4 12h16M4 18h16" id="menuIcon"/>
        </svg>
    </button>

    <a href="index.html" class="menuItem">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span class="label">Início</span>
    </a>

    <a href="projetos.html" class="menuItem">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <span class="label">Projetos</span>
    </a>

    <a href="sobre.html" class="menuItem">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 16v-4M12 8h.01"/>
        </svg>
        <span class="label">Sobre</span>
    </a>

    <a href="contato.html" class="menuItem">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-contact-icon lucide-contact"><path d="M16 2v2"/><path d="M7 22v-2a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"/><path d="M8 2v2"/><circle cx="12" cy="11" r="3"/><rect x="3" y="4" width="18" height="18" rx="2"/></svg>
        <span class="label">Contato</span>
    </a>

</div>
    <br>
    <main>
        <center>
            <h1>Projetos</h1>

            <div class="caixa">
                <h3>Comissão</h3>
                <p><b>Descrição:</b>dawdawjdajd</p>

                <button onclick="window.location = 'https://github.com/Henrique-Castanheira'" >Veja meu projeto!</button>
            </div>

            <div class="caixaColorida"></div>
        </center>
    </main>
    <footer>
        <p>&copy; Desenvolvido por Henrique Castanheira.</p>
    </footer>
    <script>
        const barra = document.getElementById('barraLateral');
        const btnMenu = document.getElementById('btnMenu');
        const menuIcon = document.getElementById('menuIcon');

        btnMenu.addEventListener('click', () => {
            barra.classList.toggle('aberto');
            
            // Troca entre menu e X
            if (barra.classList.contains('aberto')) {
                menuIcon.setAttribute('d', "M18 6L6 18M6 6h12v12");
            } else {
                menuIcon.setAttribute('d', "M4 6h16M4 12h16M4 18h16");
            }
        });
    </script>
</body>

</html>
